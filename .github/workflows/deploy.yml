name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render deployment config
        env:
          APP_URL: ${{ vars.CF_APP_URL }}
          CONTENT_URL: ${{ vars.CF_CONTENT_URL }}
          SUPERADMIN_EMAILS: ${{ vars.CF_SUPERADMIN_EMAILS }}
          ORG_EMAIL_DOMAINS: ${{ vars.CF_ORG_EMAIL_DOMAINS }}
          D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CONTENT_WORKER_NAME: ${{ vars.CF_CONTENT_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
        run: scripts/apply-config.sh

      - name: Add optional analytics beacon
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          if [ -n "${CF_ANALYTICS_TOKEN}" ]; then
            [[ "${CF_ANALYTICS_TOKEN}" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "invalid analytics token" >&2; exit 1; }
            sed -i "s#</head>#  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{\"token\": \"${CF_ANALYTICS_TOKEN}\"}'></script>\n  </head>#" packages/web/index.html
            grep -q cloudflareinsights packages/web/index.html || { echo "beacon injection failed" >&2; exit 1; }
          fi

      - name: Build web
        run: bun run build:web

      - name: Regenerate committed bundles
        working-directory: packages/api
        run: |
          bun run build:annotate
          bun run build:db
          bun run build:install
          bun run build:whatsnew

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
        run: bunx wrangler d1 migrations apply "${D1_DATABASE_NAME:-postplan-db}" -c wrangler.jsonc --remote

      - name: Ensure D1 read replication is enabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          out="$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${CF_D1_DATABASE_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"read_replication": {"mode": "auto"}}')"
          echo "$out" | grep -q '"success": *true' || { echo "$out" >&2; exit 1; }

      - name: Deploy main worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.jsonc

      - name: Deploy content worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.content.jsonc
