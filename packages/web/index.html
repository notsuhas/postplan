<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before first paint (no flash). Default: dark.
      (function () {
        try {
          var t = localStorage.getItem('postplan-theme')
          document.documentElement.classList.toggle('dark', t !== 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <title>Postplan — Artifacts for every agent</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Publish agent-built files and apps, leave anchored feedback in the browser, and let the agent close the review loop from the terminal. Open source and self-hosted."
    />
    <meta name="theme-color" content="#070b16" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Postplan — Artifacts for every agent" />
    <meta
      property="og:description"
      content="Publish agent-built files and apps, leave anchored feedback, and let the agent ship the next version."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
