<body><main><nav><strong>TINY API</strong><a href="../index.html">Back to scratch</a></nav><h1>One endpoint.<br>Useful forever.</h1><p class="lead">Store a note, get a permanent URL, and move on. No SDK and no ceremony.</p><div class="rule"></div><h2><span class="verb">POST</span> <span class="path">/notes</span></h2><pre><code>curl -X POST https://tiny.example/notes
